<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    {% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Изучаем язык - Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow mx-auto" style="width: 18rem;">
      <div class="card-header">Изучаем язык</div>
      <div class="card-body">
        <p class="card-text">Доступные слова</p>
      </div>
      <ul class="list-group list-group-flush">
        {% if word_list %}
          {% for word in word_list %}
            {% comment %}TODO active{% endcomment %}
            <li class="list-group-item list-group-item-action d-flex justify-content-between">
              <span class="my-quote my-auto">{{ word.word }}</span>
              <a class="btn btn-sm btn-primary" href="{% url 'quiz' word.id %}">Go</a>
            </li>
          {% endfor %}
        {% else %}
          <li class="list-group-item">Список слов пуст обновите базу данных</li>
        {% endif %}
      </ul>
      <div class="card-body">
        <div class="d-grid gap-2">
          <a href="#" class="btn btn-primary">Продолжить</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
