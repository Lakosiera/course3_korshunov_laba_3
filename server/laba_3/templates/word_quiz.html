<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <!--  -->
    {% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Изучаем язык - Переведи слово</title>
    <!-- указываем пути к ресурсу из папки static -->
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml" />
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon" />
    <!-- подключаем bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <!-- указываем пути к ресурсу из папки static -->
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body class="d-flex flex-column vh-100">
    <nav class="nav justify-content-end shadow">
      <a class="nav-link" href="/">На главную</a>
      <!-- указываем путь ссылки через имя в "urls.py" -->
      <a class="nav-link" href="{% url 'reset' %}">Сброс cookie</a>
      <a class="nav-link" href="/admin/">Админка</a>
    </nav>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center">
      <div class="card shadow mx-auto" style="width: 18rem;">
        <div class="card-header d-flex justify-content-between">
          Слово
          <a href="/">Назад</a>
        </div>

        <div class="card-body">
          <form class="needs-validation" action="{% url 'check' word_quiz.id %}" method="post">
            <!-- Говорим чтобы Django занялся безопасность запроса из формы (Cross Site Request Forgeries) -->
            {% csrf_token %}
            <div class="d-flex align-items-center">
              <div class="my-quote h1 mx-auto">{{ word_quiz.word }}</div>
            </div>
            
            <div class="mb-3">
              <!-- проверяем наличие сообщений messages и если они есть то делаем ввод невалидным -->
              <input type="text" class="form-control {% if messages %} is-invalid {% endif %}" name="translation" id="inputTranslation" placeholder="Переведи" aria-describedby="inputGroupPrepend" required/>
              <!-- проверяем наличие сообщений -->
              {% if messages %}
                <!-- перебираем все сообщения -->
                {% for message in messages %}
                  <!-- выводим сообщения об ошибке как часть валидации ввода -->
                  {% if message.tags == 'error' %}
                    <!-- выводим сообщение с ошибкой -->
                    <div class="invalid-feedback">{{ message }}</div>
                  {% endif %}
                {% endfor %}
              {% endif %}
            </div>

            <div class="d-grid gap-2">
              <input type="submit" class="btn btn-primary" value="Проверить" />
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
