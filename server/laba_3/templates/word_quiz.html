<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    {% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Изучаем язык - Переведи слово</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow mx-auto" style="width: 18rem;">
      <div class="card-header d-flex justify-content-between">
        Слово
        <a href="/">Назад</a>
      </div>

      <div class="card-body">
        {{cookie_value}}
        <form action="{% url 'check' word_quiz.id %}" method="post">
          {% csrf_token %}
          <div class="d-flex align-items-center">
            <div class="my-quote h1 mx-auto">{{ word_quiz.word }}</div>
          </div>
          {% if error_message %}
            <div class="mb-3">
              <p>
                <strong>{{ error_message }}</strong>
              </p>
            </div>
          {% endif %}

          <div class="mb-3">
            <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Переведи" />
          </div>
          {% comment %} <div class="mb-3">
            {% for choice in question.choice_set.all %}
              <input type="radio" name="choice" id="choice{{ forloop.counter }}" value="{{ choice.id }}" />
              <label for="choice{{ forloop.counter }}">{{ choice.choice_text }}</label><br />
            {% endfor %}
          </div> {% endcomment %}
          <div class="d-grid gap-2">
            <input type="submit" class="btn btn-primary" value="Проверить" />
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
